apiVersion: apps/v1
kind: Deployment
metadata:
  name: omega-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omega-api
  template:
    metadata:
      labels:
        app: omega-api
    spec:
      containers:
        - name: api
          image: omega-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: omega-secrets
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omega-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omega-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
